# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 3072m вместо прежних 2048m: после подключения OpenCV сборка стала заметно
# тяжелее — AGP распаковывает, мержит и упаковывает ~554 МБ нативных .so.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Kotlin компилируется внутри процесса Gradle, без отдельного демона.
#
# По умолчанию Kotlin поднимает свою JVM и общается с ней через localhost-сокет
# (RMI). На машине с 16 ГБ это третий тяжёлый процесс рядом с Android Studio и
# Gradle: на пике сборки его убивают, и билд падает с
# «Connection to the Kotlin daemon has been unexpectedly lost /
#  ConnectException: Connection refused» — без единой ошибки компиляции.
# Воспроизводилось и на Windows-машине разработчика, и в Linux-окружении CI.
#
# in-process убирает и вторую JVM, и сокет: падать и блокироваться нечему.
# Цена — инкрементальная сборка чуть медленнее из-за отсутствия тёплого демона.
kotlin.compiler.execution.strategy=in-process
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false